name: 问题反馈
description: 提供可复现的问题。
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏或自制样例，不上传真实论文与密钥。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 终端、应用版本、相关任务或提交。
  - type: textarea
    id: evidence
    attributes:
      label: 补充记录
      description: 可附脱敏截图或日志。
